<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#0f1620"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fa9f5"/>
      <stop offset="100%" stop-color="#6fc3ff"/>
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect x="20" y="20" width="660" height="460" rx="28" fill="url(#bg)" stroke="#1e293b"/>

  <!-- Monitor -->
  <rect x="120" y="90" width="460" height="260" rx="16" fill="#020617" stroke="#3fa9f5"/>
  <rect x="140" y="115" width="420" height="210" rx="10" fill="#0f172a"/>

  <!-- Code lines -->
  <rect x="160" y="145" width="180" height="12" rx="6" fill="url(#accent)"/>
  <rect x="160" y="170" width="260" height="12" rx="6" fill="#334155"/>
  <rect x="160" y="195" width="220" height="12" rx="6" fill="#334155"/>
  <rect x="160" y="220" width="300" height="12" rx="6" fill="url(#accent)"/>
  <rect x="160" y="245" width="200" height="12" rx="6" fill="#334155"/>

  <!-- Mobile -->
  <rect x="470" y="155" width="80" height="150" rx="14" fill="#020617" stroke="#3fa9f5"/>
  <rect x="480" y="175" width="60" height="95" rx="8" fill="#0f172a"/>
  <circle cx="510" cy="285" r="4" fill="#3fa9f5"/>

  <!-- Stand -->
  <rect x="320" y="360" width="60" height="12" rx="6" fill="#334155"/>
  <rect x="290" y="372" width="120" height="14" rx="7" fill="#1e293b"/>

  <!-- Floating dots -->
  <circle cx="90" cy="80" r="6" fill="#3fa9f5"/>
  <circle cx="620" cy="70" r="5" fill="#6fc3ff"/>
  <circle cx="600" cy="420" r="6" fill="#3fa9f5"/>
</svg>
