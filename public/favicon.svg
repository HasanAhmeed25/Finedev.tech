<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon -->
  <rect width="64" height="64" rx="16" fill="#0A0D18" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5" />

  <!-- Isometric 3D Hexagon / Cube Geometry -->
  <g transform="translate(32, 32)">
    <!-- Top Face -->
    <path d="M 0,-18 L 16,-9 L 0,0 L -16,-9 Z" fill="url(#topGrad)" opacity="0.95" />
    <!-- Left Face -->
    <path d="M -16,-9 L 0,0 L 0,18 L -16,9 Z" fill="url(#violetGrad)" opacity="0.85" />
    <!-- Right Face -->
    <path d="M 0,0 L 16,-9 L 16,9 L 0,18 Z" fill="url(#cyanGrad)" opacity="0.85" />
    <!-- Inner Core Node -->
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" filter="url(#glow)" />
    <!-- Connection lines -->
    <path d="M 0,-18 L 0,0" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7" />
    <path d="M -16,-9 L 0,0" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7" />
    <path d="M 16,-9 L 0,0" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7" />
    <!-- Node points -->
    <circle cx="0" cy="-18" r="2" fill="#22D3EE" />
    <circle cx="16" cy="-9" r="2" fill="#A855F7" />
    <circle cx="-16" cy="-9" r="2" fill="#C084FC" />
    <circle cx="0" cy="18" r="2" fill="#06B6D4" />
  </g>
</svg>
