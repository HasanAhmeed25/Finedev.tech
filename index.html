    <!-- Early theme detection script to prevent theme flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved ? saved : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>

    <script>
      window.addEventListener('error', function(e) {
        var errInfo = JSON.stringify({
          type: 'error',
          message: e.message,
          filename: e.filename,
          lineno: e.lineno,
          stack: e.error ? e.error.stack : null
        });
        navigator.sendBeacon('/api/client-error', errInfo);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errInfo = JSON.stringify({
          type: 'unhandledrejection',
          reason: e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'unknown'
        });
        navigator.sendBeacon('/api/client-error', errInfo);
      });
    </script>
  </head>
  <body class="antialiased selection:bg-[#285FE8]/20 selection:text-[#285FE8]">
    <div id="root"></div>
